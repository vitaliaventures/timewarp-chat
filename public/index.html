<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Fade — One-Time Notes & Secrets</title>

  <meta name="description" content="Fade lets you send a note or a secret that can only be viewed once. No signup, no accounts, nothing stored after it's read." />
  <link rel="canonical" href="https://anonymouschat.live/" />
  <link rel="icon" href="/favicon.png" type="image/png">

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Fade — One-Time Notes & Secrets" />
  <meta property="og:description" content="Send a note or a secret that can be viewed exactly once, then it's gone forever. No signup." />
  <meta property="og:url" content="https://anonymouschat.live/" />
  <meta property="og:site_name" content="Fade" />

  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    body{background:#0b0b0b;color:#eee;font-family:system-ui;margin:0;min-height:100vh;display:flex;flex-direction:column;}
    .fade-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;}
    .fade-card{width:100%;max-width:520px;background:#151515;border-radius:16px;padding:32px;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
    .fade-card h1{margin:0 0 4px 0;font-size:28px;}
    .fade-tagline{opacity:0.8;margin:0 0 20px 0;}
    .fade-tabs{display:flex;gap:8px;margin-bottom:16px;}
    .fade-tab{flex:1;padding:10px;border-radius:10px;border:1px solid #2a2a2a;background:#1c1c1c;color:#ccc;cursor:pointer;font-size:0.9rem;}
    .fade-tab.active{background:#2563eb;border-color:#2563eb;color:#fff;}
    .fade-kind-desc{font-size:0.85rem;opacity:0.7;margin-bottom:14px;}
    textarea#entry-text{width:100%;min-height:140px;resize:vertical;background:#1c1c1c;color:#fff;border:1px solid #2a2a2a;border-radius:10px;padding:12px;font-size:0.95rem;box-sizing:border-box;}
    .fade-counter{text-align:right;font-size:0.75rem;opacity:0.5;margin:4px 0 16px;}
    .fade-btn-primary{width:100%;background:#2563eb;color:#fff;border:none;padding:12px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
    .fade-btn-primary:hover{background:#1e40af;}
    .fade-btn-primary:disabled{opacity:0.6;cursor:default;}
    .fade-btn-secondary{width:100%;background:#2a2a2a;color:#eee;border:none;padding:10px;border-radius:10px;font-size:0.9rem;cursor:pointer;margin-top:10px;}
    .fade-btn-secondary:hover{background:#333;}
    .fade-error{color:#ef4444;font-size:0.85rem;margin-top:10px;}
    .fade-link-row{display:flex;gap:8px;margin:10px 0;}
    .fade-link-row input{flex:1;background:#1c1c1c;color:#fff;border:1px solid #2a2a2a;border-radius:8px;padding:10px;font-size:0.85rem;}
    .fade-warning{font-size:0.85rem;background:#241c0b;border:1px solid #4a3a12;color:#facc15;padding:10px 12px;border-radius:10px;margin:14px 0;}
    .fade-result-label{font-size:0.85rem;opacity:0.8;margin-top:20px;}
    .fade-revealed-text{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:10px;padding:16px;white-space:pre-wrap;word-break:break-word;margin:14px 0;font-size:0.95rem;}
    .fade-tools{width:100%;max-width:520px;margin-top:16px;text-align:center;}
    .fade-tools a{color:#10b981;text-decoration:none;font-size:0.9rem;}
    .fade-tools a:hover{text-decoration:underline;}
  </style>
</head>

<body>

  <div class="fade-wrap">
    <div id="app-root"><!-- app.js renders here --></div>
    <div class="fade-tools">
      🔧 Also available: <a href="/password-generator.html">Password Generator</a> · <a href="/file-hash-checker.html">File Hash Checker</a> · <a href="/name-it.html">Name It</a>
    </div>
  </div>

  <script type="module" src="/app.js" defer></script>
  <script src="/footer.js"></script>

</body>
</html>
