<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — Fade</title>
<meta name="description" content="Generate a strong, random password entirely in your browser. Nothing is sent anywhere — the password never leaves your device." />
<link rel="canonical" href="https://anonymouschat.live/password-generator.html" />
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/style.css">
<style>
  body{background:#0b0b0b;color:#eee;font-family:system-ui;margin:0;min-height:100vh;display:flex;flex-direction:column;}
  .fade-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;}
  .fade-card{width:100%;max-width:520px;background:#151515;border-radius:16px;padding:32px;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
  .fade-card h1{margin:0 0 4px 0;font-size:28px;}
  .fade-tagline{opacity:0.8;margin:0 0 20px 0;}
  .pw-display{display:flex;gap:8px;margin-bottom:20px;}
  .pw-display input{flex:1;background:#1c1c1c;color:#fff;border:1px solid #2a2a2a;border-radius:10px;padding:14px;font-size:1.1rem;font-family:monospace;letter-spacing:1px;}
  .pw-btn{background:#2a2a2a;color:#eee;border:none;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:0.9rem;white-space:nowrap;}
  .pw-btn:hover{background:#333;}
  .pw-row{margin-bottom:14px;}
  .pw-row label{display:flex;justify-content:space-between;font-size:0.9rem;opacity:0.85;margin-bottom:6px;}
  .pw-row input[type="range"]{width:100%;}
  .pw-check{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:0.95rem;}
  .pw-check input{width:18px;height:18px;}
  .fade-btn-primary{width:100%;background:#2563eb;color:#fff;border:none;padding:12px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:10px;}
  .fade-btn-primary:hover{background:#1e40af;}
  .strength-bar{height:6px;border-radius:3px;background:#2a2a2a;margin-top:8px;overflow:hidden;}
  .strength-fill{height:100%;width:0%;transition:width 0.2s ease, background 0.2s ease;}
  .strength-label{font-size:0.8rem;opacity:0.7;margin-top:4px;}
  .fade-note{font-size:0.8rem;opacity:0.6;margin-top:20px;text-align:center;}
  .back-link{display:inline-block;margin-bottom:16px;color:#10b981;text-decoration:none;font-size:0.9rem;}
</style>
</head>
<body>

<div class="fade-wrap">
  <div class="fade-card">
    <a href="/" class="back-link">← Fade</a>
    <h1>Password Generator</h1>
    <p class="fade-tagline">Generated entirely in your browser. Never sent anywhere, never stored.</p>

    <div class="pw-display">
      <input type="text" id="pw-output" readonly value="">
      <button type="button" id="pw-copy" class="pw-btn">Copy</button>
      <button type="button" id="pw-refresh" class="pw-btn">🔄</button>
    </div>

    <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
    <div class="strength-label" id="strength-label"></div>

    <div class="pw-row" style="margin-top:20px;">
      <label>Length <span id="length-value">16</span></label>
      <input type="range" id="pw-length" min="6" max="64" value="16">
    </div>

    <div class="pw-check">
      <input type="checkbox" id="opt-uppercase" checked>
      <label for="opt-uppercase">Uppercase letters (A-Z)</label>
    </div>
    <div class="pw-check">
      <input type="checkbox" id="opt-lowercase" checked>
      <label for="opt-lowercase">Lowercase letters (a-z)</label>
    </div>
    <div class="pw-check">
      <input type="checkbox" id="opt-numbers" checked>
      <label for="opt-numbers">Numbers (0-9)</label>
    </div>
    <div class="pw-check">
      <input type="checkbox" id="opt-symbols" checked>
      <label for="opt-symbols">Symbols (!@#$%...)</label>
    </div>

    <button type="button" id="pw-generate" class="fade-btn-primary">Generate new password</button>

    <p class="fade-note">Uses your browser's cryptographically secure random number generator (crypto.getRandomValues) — the same kind used for encryption keys, not a predictable Math.random().</p>
  </div>
</div>

<script src="/footer.js"></script>
<script>
(function () {
  const CHARSETS = {
    uppercase: "ABCDEFGHJKLMNPQRSTUVWXYZ",
    lowercase: "abcdefghijkmnpqrstuvwxyz",
    numbers: "23456789",
    symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?"
  };

  const lengthInput = document.getElementById("pw-length");
  const lengthValue = document.getElementById("length-value");
  const output = document.getElementById("pw-output");
  const copyBtn = document.getElementById("pw-copy");
  const refreshBtn = document.getElementById("pw-refresh");
  const generateBtn = document.getElementById("pw-generate");
  const strengthFill = document.getElementById("strength-fill");
  const strengthLabel = document.getElementById("strength-label");

  const checks = {
    uppercase: document.getElementById("opt-uppercase"),
    lowercase: document.getElementById("opt-lowercase"),
    numbers: document.getElementById("opt-numbers"),
    symbols: document.getElementById("opt-symbols")
  };

  function getActiveCharset() {
    let charset = "";
    for (const key in checks) {
      if (checks[key].checked) charset += CHARSETS[key];
    }
    return charset;
  }

  function generatePassword() {
    const length = parseInt(lengthInput.value, 10);
    const charset = getActiveCharset();

    if (!charset) {
      output.value = "";
      strengthLabel.textContent = "Select at least one character type.";
      strengthFill.style.width = "0%";
      return;
    }

    // crypto.getRandomValues is the browser's cryptographically secure RNG —
    // the same one used for generating encryption keys, unlike Math.random()
    // which is predictable and not safe for anything security-related.
    const randomValues = new Uint32Array(length);
    crypto.getRandomValues(randomValues);

    let password = "";
    for (let i = 0; i < length; i++) {
      password += charset[randomValues[i] % charset.length];
    }

    output.value = password;
    updateStrength(length, charset.length);
  }

  function updateStrength(length, poolSize) {
    // Rough entropy estimate: bits = length * log2(poolSize)
    const bits = length * Math.log2(poolSize || 1);
    let label, color, percent;

    if (bits < 40) {
      label = "Weak"; color = "#ef4444"; percent = 25;
    } else if (bits < 60) {
      label = "Fair"; color = "#facc15"; percent = 50;
    } else if (bits < 80) {
      label = "Strong"; color = "#22c55e"; percent = 75;
    } else {
      label = "Very strong"; color = "#22c55e"; percent = 100;
    }

    strengthFill.style.width = percent + "%";
    strengthFill.style.background = color;
    strengthLabel.textContent = `${label} — about ${Math.round(bits)} bits of entropy`;
  }

  lengthInput.addEventListener("input", () => {
    lengthValue.textContent = lengthInput.value;
    generatePassword();
  });

  Object.values(checks).forEach(cb => cb.addEventListener("change", generatePassword));
  generateBtn.addEventListener("click", generatePassword);
  refreshBtn.addEventListener("click", generatePassword);

  copyBtn.addEventListener("click", () => {
    if (!output.value) return;
    navigator.clipboard.writeText(output.value).then(() => {
      copyBtn.textContent = "Copied!";
      setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
    });
  });

  // Generate one on page load
  generatePassword();
})();
</script>

</body>
</html>
